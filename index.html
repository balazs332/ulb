<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULB</title>

<style>
:root{
 --bg-blue:#0B2F73;
 --logo-blue:#002570;
}

*{box-sizing:border-box;}

html,body{
 margin:0;
 min-height:100%;
 background:var(--bg-blue);
 font-family:Arial, Helvetica, sans-serif;
}

.page{
 min-height:100vh;
 display:flex;
 flex-direction:column;
}

.screen{
 flex:1;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:24px;
}

.login-card{
 width:min(92vw,420px);
 background:var(--logo-blue);
 border-radius:18px;
 padding:30px 28px 28px 28px;
 text-align:center;
}

.logo-top{
 width:160px;
 margin:0 auto 22px auto;
 display:block;
}

input{
 width:100%;
 padding:14px;
 margin-bottom:12px;
 border-radius:10px;
 border:none;
 background:rgba(255,255,255,0.15);
 color:white;
 font-size:15px;
}

button{
 width:100%;
 padding:14px;
 border-radius:10px;
 border:none;
 background:white;
 color:var(--logo-blue);
 font-weight:bold;
 cursor:pointer;
}

.error{
 margin-top:10px;
 color:#ffdede;
 font-size:14px;
 min-height:18px;
}

.hidden{
 display:none;
}

.logo-main{
 width:min(80vw,520px);
}

footer{
 text-align:center;
 color:white;
 font-size:12px;
 padding:18px 14px 24px 14px;
 opacity:0.9;
 line-height:1.7;
}

.sep{
 opacity:0.75;
 padding:0 8px;
}

.nowrap{
 white-space:nowrap;
}

@media (max-width:700px){
 footer{
  font-size:11px;
 }
}

</style>

</head>

<body>

<div class="page">

<section id="loginScreen" class="screen">

<div class="login-card">

<img src="logo.PNG" class="logo-top" onerror="this.onerror=null;this.src='logo.png';">

<form id="loginForm">

<input id="username" placeholder="Felhasználónév" required>
<input id="password" type="password" placeholder="Jelszó" required>

<button>Belépés</button>

<div id="error" class="error"></div>

</form>

</div>

</section>


<section id="contentScreen" class="screen hidden">

<img src="logo.PNG" class="logo-main" onerror="this.onerror=null;this.src='logo.png';">

</section>


<footer>

<span>ULB Kft.</span>
<span class="sep">I</span>

<span>Adószám: 28808749-2-43</span>
<span class="sep">I</span>

<span>Cégjegyzékszám: 01-09-374943</span>
<span class="sep">I</span>

<span class="nowrap">Cím: 1192 Budapest, Taksony utca 7.</span>
<span class="sep">I</span>

<span class="nowrap">IBAN: HU39104040725052697757751004</span>

</footer>

</div>


<script>

const USER="admin";
const PASS="ulb2026";

document.getElementById("loginForm").addEventListener("submit",e=>{

e.preventDefault();

let u=document.getElementById("username").value;
let p=document.getElementById("password").value;

if(u===USER && p===PASS){

document.getElementById("loginScreen").classList.add("hidden");
document.getElementById("contentScreen").classList.remove("hidden");

}else{

document.getElementById("error").innerText="Hibás adat";

}

});

</script>

</body>
</html>
