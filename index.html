<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ULB</title>
  <style>
    :root{
      --brand-blue:#002570;
    }

    *{
      box-sizing:border-box;
    }

    html, body{
      margin:0;
      width:100%;
      min-height:100%;
      background:var(--brand-blue);
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .wrap{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .logo{
      display:block;
      width:min(78vw, 520px);
      height:auto;
      max-width:100%;
    }

    @media (max-width: 480px){
      body{
        padding:20px;
      }

      .logo{
        width:min(82vw, 360px);
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img
      src="logo.PNG"
      alt="ULB"
      class="logo"
      onerror="this.onerror=null;this.src='logo.png';"
    />
  </div>
</body>
</html>
