<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULB</title>

<style>
:root{
 --brand-blue:#0B2F73;
 --panel-bg:rgba(0,37,112,0.55);
 --panel-border:rgba(255,255,255,0.25);
 --text:#ffffff;
}

*{box-sizing:border-box;}

html,body{
 margin:0;
 min-height:100%;
 background:var(--brand-blue);
 font-family:Arial, Helvetica, sans-serif;
}

.screen{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:24px;
}

.login-card{
 width:min(92vw,420px);
 background:var(--panel-bg);
 border:1px solid var(--panel-border);
 border-radius:18px;
 padding:26px;
 backdrop-filter:blur(10px);
 text-align:center;
}

.logo-top{
 width:150px;
 margin:0 auto 20px auto;
 display:block;
 background:white;
 padding:14px;
 border-radius:12px;
}

h1{
 margin:0 0 18px 0;
 color:white;
 font-size:22px;
}

input{
 width:100%;
 padding:14px;
 margin-bottom:12px;
 border-radius:10px;
 border:1px solid rgba(255,255,255,0.25);
 background:rgba(255,255,255,0.12);
 color:white;
 font-size:15px;
}

button{
 width:100%;
 padding:14px;
 border-radius:10px;
 border:none;
 background:white;
 color:#0B2F73;
 font-weight:bold;
 cursor:pointer;
}

.error{
 margin-top:10px;
 color:#ffdede;
 font-size:14px;
 min-height:18px;
}

.hidden{
 display:none;
}

.logo-main{
 width:min(80vw,520px);
 background:white;
 padding:22px;
 border-radius:18px;
}

</style>

</head>

<body>

<section id="loginScreen" class="screen">

<div class="login-card">

<img src="logo.PNG" class="logo-top" onerror="this.onerror=null;this.src='logo.png';">

<h1>Belépés</h1>

<form id="loginForm">

<input id="username" placeholder="Felhasználónév" required>
<input id="password" type="password" placeholder="Jelszó" required>

<button>Belépés</button>

<div id="error" class="error"></div>

</form>

</div>

</section>


<section id="contentScreen" class="screen hidden">

<img src="logo.PNG" class="logo-main" onerror="this.onerror=null;this.src='logo.png';">

</section>


<script>

const USER="admin";
const PASS="ulb2026";

document.getElementById("loginForm").addEventListener("submit",e=>{

e.preventDefault();

let u=document.getElementById("username").value;
let p=document.getElementById("password").value;

if(u===USER && p===PASS){

document.getElementById("loginScreen").classList.add("hidden");
document.getElementById("contentScreen").classList.remove("hidden");

}else{

document.getElementById("error").innerText="Hibás adat";

}

});

</script>


</body>
</html>
