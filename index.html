<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ULB</title>

<style>
:root{
  --brand-blue:#0b2f6b;
}

html,body{
  margin:0;
  padding:0;
  height:100%;
  background:var(--brand-blue);
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}

/* responsive logo size */
.logo{
  width:clamp(180px, 42vw, 520px);
  height:auto;
}

/* subtle fade-in */
.logo{
  opacity:0;
  transform:translateY(10px);
  animation:fadein 0.9s ease forwards;
}

@keyframes fadein{
  to{
    opacity:1;
    transform:translateY(0);
  }
}
</style>

</head>

<body>

<img src="logo.png" alt="ULB" class="logo">

</body>
</html>
